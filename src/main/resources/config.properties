# ======================================
# Framework Configuration Properties
# ======================================

# Application Type: web or mobile
APP_TYPE=web

# ======================================
# WEB Configuration
# ======================================

# Browser Type: chrome, firefox, ie
BROWSER=chrome

# URL for Web Application
URL=https://www.google.com

# Implicit Wait Time (in seconds)
IMPLICIT_WAIT=10

# Explicit Wait Time (in seconds)
EXPLICIT_WAIT=15

# Browser Window Size: maximize, custom
WINDOW_SIZE=maximize

# Custom Window Width (if not maximize)
WINDOW_WIDTH=1920

# Custom Window Height (if not maximize)
WINDOW_HEIGHT=1080

# ======================================
# MOBILE Configuration
# ======================================

# Mobile OS: android or ios
MOBILE_OS=android

# Mobile App Type: native or web
APP_MOBILE_TYPE=native

# Appium Server URL
APPIUM_SERVER_URL=http://127.0.0.1:4723

# ======================================
# Android Configuration
# ======================================

# Android Device Name
ANDROID_DEVICE_NAME=emulator-5554

# Android Platform Version
ANDROID_PLATFORM_VERSION=16

# Android App Package (for native apps)
ANDROID_APP_PACKAGE=com.google.android.dialer

# Android App Activity (for native apps)
ANDROID_APP_ACTIVITY=com.google.android.dialer.extensions.GoogleDialtactsActivity

# Android App Path (APK file path for native apps)
ANDROID_APP_PATH=/path/to/app.apk

# Automation Name: UiAutomator2 (for native), Chromium (for web)
ANDROID_AUTOMATION_NAME=UiAutomator2

# ======================================
# iOS Configuration
# ======================================

# iOS Device Name
IOS_DEVICE_NAME=iPhone 17 Pro

# iOS Platform Version
IOS_PLATFORM_VERSION=26.5

# iOS Bundle ID (for native apps)
IOS_BUNDLE_ID=com.apple.DocumentsApp

# iOS App Path (IPA file path for native apps)
IOS_APP_PATH=/path/to/app.ipa

# Automation Name: XCUITest (for native), Safari (for web)
IOS_AUTOMATION_NAME=XCUITest

# ======================================
# Logging Configuration
# ======================================

# Log Level: INFO, DEBUG, ERROR
LOG_LEVEL=INFO

# Screenshot on Failure
SCREENSHOT_ON_FAILURE=true

# Video Recording for Mobile
VIDEO_RECORDING=false

